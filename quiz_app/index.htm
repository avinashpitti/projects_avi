<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f2f2f2;
    }
    .quiz-container {
      width: 400px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
      text-align: center;
    }
    #main {
      background-color: rgb(27, 27, 124);
      color: white;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .cl1 {
      border-radius: 10px;
      text-align: center;
      padding: 10px;
      color: white;
      background-color: rgb(88, 73, 73);
      margin-top: 10px;
      font-size: medium;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .cl1:hover {
      background-color: rgb(60, 60, 60);
      transform: scale(1.05);
      transition: 0.2s;
    }
    #next-btn {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      border: none;
      background: rgb(27, 27, 124);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      display: none;
    }
    #score {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1 id="main">QUIZ</h1>
    <h3 id="sub">Pick the correct answer.</h3>
    <p id="question"></p>
    <div id="options"></div>
    <button id="next-btn">Next</button>
    <p id="score"></p>
  </div>

  <script>
    const quizData = [
      {
        question: "Q1. Which of the following is not a frontend framework?",
        options: ["React", "Angular", "Vue", "Django"],
        answer: "Django"
      },
      {
        question: "Q2. Which language is used for styling web pages?",
        options: ["HTML", "JQuery", "CSS", "XML"],
        answer: "CSS"
      },
      {
        question: "Q3. Inside which HTML element do we put JavaScript?",
        options: ["<js>", "<javascript>", "<script>", "<code>"],
        answer: "<script>"
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");

    function loadQuestion() {
      resetState();
      const currentQuiz = quizData[currentQuestion];
      questionEl.innerText = currentQuiz.question;
      currentQuiz.options.forEach(option => {
        const button = document.createElement("button");
        button.innerText = option;
        button.classList.add("cl1");
        button.addEventListener("click", () => selectAnswer(button, currentQuiz.answer));
        optionsEl.appendChild(button);
      });
    }

    function resetState() {
      nextBtn.style.display = "none";
      while (optionsEl.firstChild) {
        optionsEl.removeChild(optionsEl.firstChild);
      }
    }

    function selectAnswer(button, correctAnswer) {
      const isCorrect = button.innerText === correctAnswer;
      if (isCorrect) {
        button.style.backgroundColor = "green";
        score++;
      } else {
        button.style.backgroundColor = "red";
      }
      Array.from(optionsEl.children).forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correctAnswer) {
          btn.style.backgroundColor = "green";
        }
      });
      nextBtn.style.display = "block";
    }

    function showScore() {
      resetState();
      questionEl.innerText = "Quiz Completed!";
      scoreEl.innerText = `Your Score: ${score} / ${quizData.length}`;
      nextBtn.innerText = "Restart";
      nextBtn.style.display = "block";
    }

    nextBtn.addEventListener("click", () => {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showScore();
      }
    });

    loadQuestion();
  </script>
</body>
</html>
